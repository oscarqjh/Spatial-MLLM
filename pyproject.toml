[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-mllm"
version = "0.1.0"
description = "Spatial-MLLM: Boosting MLLM Capabilities in Visual-based Spatial Intelligence"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Diankun Wu", email = "wudiankun@gmail.com"},
    {name = "Fangfu Liu", email = "liuff19@gmail.com"},
    {name = "Yi-Hsin Hung"},
    {name = "Yueqi Duan"},
]
keywords = ["computer vision", "multimodal", "spatial intelligence", "MLLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Dependencies based on original Spatial-MLLM README requirements
# pip install torch==2.6.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
# pip install transformers==4.51.3 accelerate==1.5.2 qwen_vl_utils decord ray Levenshtein tyro
# pip install flash-attn --no-build-isolation
dependencies = [
    "torch==2.6.0",
    "torchvision",
    "torchaudio", 
    "transformers==4.51.3",
    "accelerate==1.5.2",
    "qwen_vl_utils",
    "decord",
    "ray",
    "Levenshtein",
    "tyro",
    "huggingface_hub",
    "safetensors",
    "Pillow",
    "numpy",
]

[project.optional-dependencies]
flash-attn = ["flash-attn"]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
]

[project.urls]
Homepage = "https://diankun-wu.github.io/Spatial-MLLM/"
Repository = "https://github.com/oscarqjh/Spatial-MLLM"
"Bug Tracker" = "https://github.com/oscarqjh/Spatial-MLLM/issues"
Documentation = "https://diankun-wu.github.io/Spatial-MLLM/"
"Paper" = "https://arxiv.org/abs/2505.23747"

[tool.setuptools.packages.find]
where = ["."]
include = ["spatialmllm*"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
